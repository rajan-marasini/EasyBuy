name: Keep Alive - Render Free Tier Server

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleep happens after 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f https://easybuy-api.onrender.com/api/v1/health || echo "Server waking up or unreachable"
